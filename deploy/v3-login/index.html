<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Godoy Auto Care — Teste de login V3</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
body{background:#0b0d10;color:#f6f6f6;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
main{width:min(100%,400px);border:1px solid #333;border-radius:16px;padding:26px;background:#151719}
h1{font-size:1.6rem;margin:0 0 8px}p{color:#bbb;line-height:1.5}
label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;border-radius:9px;padding:13px;font:inherit}
input{background:#0b0d10;color:white;border:1px solid #555}button{background:white;color:#111;border:0;font-weight:700;margin-top:20px}
button:disabled{opacity:.6}#logout{background:#303030;color:white}#status{min-height:1.5em}small{color:#aaa}
</style>
</head>
<body>
<main>
<h1>GODOY AUTO CARE</h1>
<p>Manager V3 · Teste privado de autenticação</p>
<form id="login">
<label for="email">E-mail</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Senha</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">Entrar</button>
</form>
<section id="logged" hidden>
<p>Login confirmado! Esta página ainda não exibe nem sincroniza dados da empresa.</p>
<button id="logout" type="button">Sair</button>
</section>
<p id="status" role="status" aria-live="polite"></p>
<small>Protótipo de autenticação. Não use com dados reais.</small>
</main>
<script>
window.GODOY_SUPABASE = Object.freeze({
  url: "https://xuwkfjnufpljxcibdqti.supabase.co",
  publishableKey: "sb_publishable_XCS9SOeEz6mbCFxV5Lw24A_8wjhgY25"
});
</script>
<script src="cloud-store.js"></script>
<script>
'use strict';
(() => {
  const config = window.GODOY_SUPABASE;
  const form = document.getElementById('login');
  const logged = document.getElementById('logged');
  const status = document.getElementById('status');
  const submit = document.getElementById('submit');
  let accessToken = null;
  const endpoint = config.url.replace(/\/$/, '') + '/auth/v1/token?grant_type=password';
  const headers = {'Content-Type':'application/json', 'apikey':config.publishableKey};
  form.addEventListener('submit', async event => {
    event.preventDefault();
    submit.disabled = true;
    status.textContent = 'Verificando acesso...';
    try {
      const response = await fetch(endpoint, {
        method:'POST', headers,
        body:JSON.stringify({
          email:document.getElementById('email').value.trim(),
          password:document.getElementById('password').value
        })
      });
      if (!response.ok) throw new Error('Não foi possível entrar. Confira e-mail, senha e conexão.');
      const result = await response.json();
      if (!result.access_token) throw new Error('Resposta de autenticação inválida.');
      accessToken = result.access_token; // somente memória, nunca localStorage
      document.getElementById('password').value = '';
      form.hidden = true;
      logged.hidden = false;
      status.textContent = 'Autenticação realizada. Verificando acesso aos dados...';
      try {
        const user = await window.GodoyCloud.user(accessToken);
        const document = await window.GodoyCloud.load(accessToken, user.id);
        status.textContent = document
          ? 'Acesso autorizado. Documento na nuvem encontrado (revisão ' + document.revision + ').'
          : 'Acesso autorizado. Nenhum documento na nuvem ainda; seus dados locais não foram alterados.';
      } catch (error) {
        status.textContent = 'Login confirmado, mas a verificação dos dados falhou: ' + error.message;
      }
    } catch (error) {
      status.textContent = error.message || 'Falha de conexão.';
    } finally {
      submit.disabled = false;
    }
  });
  document.getElementById('logout').addEventListener('click', async () => {
    const token = accessToken;
    accessToken = null;
    form.hidden = false;
    logged.hidden = true;
    status.textContent = 'Sessão local encerrada.';
    document.getElementById('password').value = '';
    if (token) {
      try {
        await fetch(config.url.replace(/\/$/, '') + '/auth/v1/logout', {
          method:'POST', headers:{...headers,Authorization:'Bearer '+token}
        });
      } catch (_) { status.textContent = 'Sessão local encerrada. Não foi possível confirmar saída no servidor.'; }
    }
  });
})();
</script>
</body>
</html>
