<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><title>Godoy Auto Care Manager</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f5;background:#0b0d10}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{background:#111419;border-right:1px solid #292e35;padding:28px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-weight:900;letter-spacing:.09em;font-size:18px;line-height:1.15;padding:6px 12px}.brand span{color:#9ca3af}.brand small{display:block;font-size:10px;font-weight:500;color:#89909b;letter-spacing:.18em;margin-top:8px}.nav{display:grid;gap:5px}.nav button{background:none;border:0;color:#a5acb5;text-align:left;padding:13px 15px;border-radius:10px}.nav button.active,.nav button:hover{background:#292e36;color:white}.sidefoot{margin-top:auto;font-size:11px;color:#7e8793;padding:10px}.main{padding:38px;max-width:1350px;width:100%;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}h1{font-size:27px;margin:0 0 6px}h2{font-size:18px;margin:0 0 18px}p{color:#9aa3ae;margin:0}.pill{border:1px solid #3a424c;border-radius:100px;padding:8px 12px;font-size:12px;color:#bfc6cf}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#171b21;border:1px solid #292f38;border-radius:16px;padding:21px}.card label{color:#a0a8b3;font-size:12px;display:block;margin-bottom:13px}.card strong{font-size:25px}.panel{margin-top:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;background:#f3f4f6;color:#111418;font-weight:700}.btn.secondary{background:#2b313a;color:white}.btn.danger{background:#46252a;color:#ffe3e3}.btn.small{padding:7px 10px;font-size:12px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#b8c0cb}input,select,textarea{width:100%;padding:12px;border:1px solid #39414b;border-radius:9px;background:#101318;color:white;outline:none}input:focus,select:focus,textarea:focus{border-color:#c6ccd4}textarea{min-height:85px;resize:vertical}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:550px}th,td{padding:14px 10px;border-bottom:1px solid #303640;font-size:13px}th{color:#9fa8b3;font-weight:600}td{color:#e8eaee}.tag{display:inline-block;border-radius:100px;background:#333a44;padding:5px 9px;font-size:11px}.tag.ok{background:#1e4235;color:#a6efd0}.tag.cancel{background:#442a30;color:#ffc0c6}.muted{color:#99a2ad}.empty{padding:30px;text-align:center;color:#929ba6}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.check{display:flex;gap:10px;align-items:flex-start;color:#d7dce3;font-size:13px}.check input{width:auto;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:13px;border:1px solid #3b414b;border-radius:12px;color:#b5bec9;font-size:12px;margin-top:18px}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none!important}.mobile-nav{display:none}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:700px){.app{display:block}.sidebar{display:none}.main{padding:24px 15px 95px}h1{font-size:23px}.cards{gap:9px}.card{padding:15px}.card strong{font-size:21px}.panel{padding:16px}.form,.checks{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#111419;border-top:1px solid #303640;padding:9px 5px max(9px,env(safe-area-inset-bottom));z-index:10;justify-content:space-around}.mobile-nav button{border:0;background:transparent;color:#a0a8b2;font-size:10px;padding:7px 4px}.mobile-nav button.active{color:white;font-weight:800}.pill{font-size:10px}} </style></head><body><div class="app"><aside class="sidebar"><div class="brand">GODOY <span>AUTO CARE</span><small>MANAGER / ADMIN</small></div><nav class="nav" id="desktopNav"></nav><div class="sidefoot">Versão 1.0 • Uso local<br>Godoy Auto Care — Cuiabá, MT</div></aside><main class="main"><header><div><h1 id="pageTitle">Visão geral</h1><p id="pageSub">Seu negócio em um só lugar.</p></div><div class="pill">● Modo local</div></header><div id="view"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav><script>
'use strict';const KEY='godoy_manager_v1';const steps=['Inspeção inicial e danos preexistentes','Pré-enxágue','Rodas e pneus','Lavagem da carroceria','Enxágue','Secagem','Limpeza interna básica (se contratada)','Inspeção final'];const tabs=[['dashboard','◫','Painel'],['appointments','▦','Agenda'],['customers','♙','Clientes'],['inspections','☑','Fichas'],['finance','＄','Financeiro'],['settings','⚙','Dados']];let page='dashboard';let db=load();function fresh(){return{customers:[],appointments:[],inspections:[],expenses:[]}}function load(){try{const o=JSON.parse(localStorage.getItem(KEY));if(o&&['customers','appointments','inspections','expenses'].every(k=>Array.isArray(o[k])))return o}catch(e){}return fresh()}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Não foi possível salvar neste navegador. Exporte os dados e verifique o espaço disponível.')}}function id(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random())}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function val(f,k){return f.elements[k]?.value?.trim()||''}function dateBR(s){if(!s)return'—';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`}function customerName(cid){return db.customers.find(x=>x.id===cid)?.name||'Cliente excluído'}function completed(){return db.appointments.filter(a=>a.status==='Concluído')}function income(){return completed().reduce((s,a)=>s+Number(a.price),0)}function expenses(){return db.expenses.reduce((s,e)=>s+Number(e.amount),0)}function setPage(p){page=p;render();window.scrollTo(0,0)}function nav(){for(const target of ['desktopNav','mobileNav'])document.getElementById(target).innerHTML=tabs.map(([key,icon,label])=>`<button class="${page===key?'active':''}" data-page="${key}">${icon} ${label}</button>`).join('')}function customerOptions(){return db.customers.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} — ${esc(c.vehicle)}</option>`).join('')}function empty(t){return `<div class="empty">${t}</div>`}function render(){nav();const meta={dashboard:['Visão geral','Seu negócio em um só lugar.'],appointments:['Agendamentos','Organize seus próximos serviços.'],customers:['Clientes e veículos','Histórico de clientes da Godoy Auto Care.'],inspections:['Fichas de lavagem','Inspeção e controle de qualidade.'],finance:['Controle financeiro','Receitas e despesas registradas.'],settings:['Dados e segurança','Cópias de segurança e informações da versão.']};document.getElementById('pageTitle').textContent=meta[page][0];document.getElementById('pageSub').textContent=meta[page][1];document.getElementById('view').innerHTML=({dashboard,appointments,customers,inspections,finance,settings})[page]();}
function dashboard(){const next=db.appointments.filter(a=>a.status==='Agendado').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="cards"><div class="card"><label>Faturamento recebido*</label><strong>${money(income())}</strong></div><div class="card"><label>Lavagens concluídas</label><strong>${completed().length}</strong></div><div class="card"><label>Clientes cadastrados</label><strong>${db.customers.length}</strong></div><div class="card"><label>Agendamentos pendentes</label><strong>${next.length}</strong></div></div><section class="panel"><div class="row"><h2>Próximos atendimentos</h2><button class="btn" data-page="appointments">+ Agendar</button></div>${next.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Valor</th></tr></thead><tbody>${next.slice(0,8).map(a=>`<tr><td>${dateBR(a.date)} ${esc(a.time)}</td><td>${esc(customerName(a.customerId))}</td><td>${esc(a.service)}</td><td>${money(a.price)}</td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum agendamento pendente.')}</section><div class="notice">* Faturamento calculado pelos atendimentos marcados como concluídos. Não confirma pagamento recebido; para usar em operação real, precisaremos adicionar controle de pagamentos.</div>`}
function customers(){return `<section class="panel"><h2>Novo cliente</h2><form id="customerForm" class="form"><div class="field"><label>Nome *</label><input name="name" required maxlength="100" placeholder="Nome do cliente"></div><div class="field"><label>Telefone (opcional)</label><input name="phone" type="tel" maxlength="30" placeholder="(65) 99999-9999"></div><div class="field"><label>Veículo *</label><input name="vehicle" required maxlength="100" placeholder="Ex.: Toyota Etios Platinum"></div><div class="field"><label>Placa (opcional)</label><input name="plate" maxlength="10" placeholder="ABC1D23"></div><div class="field full"><button class="btn" type="submit">Cadastrar cliente</button></div></form></section><section class="panel"><h2>Clientes cadastrados (${db.customers.length})</h2>${db.customers.length?`<div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Veículo</th><th>Telefone</th><th></th></tr></thead><tbody>${db.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.vehicle)} ${c.plate?'· '+esc(c.plate):''}</td><td>${esc(c.phone||'—')}</td><td><button class="btn small secondary" data-action="removeCustomer" data-id="${c.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum cliente cadastrado.')}</section>`}
function appointments(){return `<section class="panel"><h2>Novo agendamento</h2>${db.customers.length?`<form id="appointmentForm" class="form"><div class="field"><label>Cliente *</label><select name="customerId" required>${customerOptions()}</select></div><div class="field"><label>Serviço *</label><select name="service"><option>Lavagem externa</option><option>Externa + interna básica</option></select></div><div class="field"><label>Data *</label><input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label>Horário *</label><input name="time" type="time" required value="09:00"></div><div class="field"><label>Valor combinado (R$) *</label><input name="price" type="number" min="0" step="0.01" required value="40"></div><div class="field"><label>Observações</label><input name="notes" maxlength="250" placeholder="Opcional"></div><div class="field full"><button class="btn" type="submit">Salvar agendamento</button></div></form>`:empty('Cadastre um cliente antes de criar um agendamento.')} </section><section class="panel"><h2>Agenda (${db.appointments.length})</h2>${db.appointments.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody>${[...db.appointments].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(a=>`<tr><td>${dateBR(a.date)} ${esc(a.time)}</td><td>${esc(customerName(a.customerId))}</td><td>${esc(a.service)}</td><td>${money(a.price)}</td><td><span class="tag ${a.status==='Concluído'?'ok':a.status==='Cancelado'?'cancel':''}">${esc(a.status)}</span></td><td><div class="actions">${a.status==='Agendado'?`<button class="btn small" data-action="complete" data-id="${a.id}">Concluir</button><button class="btn small secondary" data-action="cancel" data-id="${a.id}">Cancelar</button>`:''}<button class="btn small danger" data-action="removeAppointment" data-id="${a.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhum agendamento registrado.')}</section>`}
function inspections(){return `<section class="panel"><h2>Nova ficha de inspeção</h2>${db.customers.length?`<form id="inspectionForm" class="form"><div class="field"><label>Cliente *</label><select name="customerId" required>${customerOptions()}</select></div><div class="field"><label>Data *</label><input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label>Nível de sujeira</label><select name="dirt"><option>Leve</option><option selected>Normal</option><option>Intensa</option></select></div><div class="field"><label>V-Floc usado (mL)</label><input name="shampoo" type="number" min="0" step="0.1" placeholder="Ex.: 20"></div><div class="field"><label>Início</label><input name="start" type="time"></div><div class="field"><label>Fim</label><input name="end" type="time"></div><div class="field full"><label>Checklist</label><div class="checks">${steps.map((s,i)=>`<label class="check"><input type="checkbox" name="step${i}"><span>${esc(s)}</span></label>`).join('')}</div></div><div class="field full"><label>Observações (inclua danos preexistentes)</label><textarea name="notes" maxlength="1500" placeholder="Anote as condições do veículo e detalhes da lavagem..."></textarea></div><div class="field full"><button class="btn" type="submit">Salvar ficha</button></div></form>`:empty('Cadastre um cliente antes de criar uma ficha.')}</section><section class="panel"><h2>Fichas salvas (${db.inspections.length})</h2>${db.inspections.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Etapas</th><th>Produto</th><th></th></tr></thead><tbody>${[...db.inspections].reverse().map(i=>`<tr><td>${dateBR(i.date)}</td><td>${esc(customerName(i.customerId))}</td><td>${i.steps.length}/${steps.length}</td><td>${i.shampoo!==''?esc(i.shampoo)+' mL':'—'}</td><td><div class="actions"><button class="btn small secondary" data-action="viewInspection" data-id="${i.id}">Ver</button><button class="btn small danger" data-action="removeInspection" data-id="${i.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma ficha registrada.')}</section>`}
function finance(){return `<div class="cards"><div class="card"><label>Receita registrada*</label><strong>${money(income())}</strong></div><div class="card"><label>Despesas registradas</label><strong>${money(expenses())}</strong></div><div class="card"><label>Saldo parcial</label><strong>${money(income()-expenses())}</strong></div><div class="card"><label>Ticket médio</label><strong>${money(completed().length?income()/completed().length:0)}</strong></div></div><section class="panel"><h2>Registrar despesa</h2><form id="expenseForm" class="form"><div class="field"><label>Descrição *</label><input name="description" maxlength="120" required placeholder="Ex.: Panos de microfibra"></div><div class="field"><label>Valor (R$) *</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Data *</label><input name="date" type="date" required value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label>Categoria</label><select name="category"><option>Produtos</option><option>Equipamentos</option><option>Água e energia</option><option>Mão de obra</option><option>Outros</option></select></div><div class="field full"><button class="btn" type="submit">Registrar despesa</button></div></form></section><section class="panel"><h2>Despesas (${db.expenses.length})</h2>${db.expenses.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th><th></th></tr></thead><tbody>${[...db.expenses].reverse().map(e=>`<tr><td>${dateBR(e.date)}</td><td>${esc(e.description)}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td><button class="btn small danger" data-action="removeExpense" data-id="${e.id}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:empty('Nenhuma despesa registrada.')}</section><div class="notice">* Receitas estimadas a partir dos serviços concluídos; não há confirmação de pagamento nesta versão. Saldo parcial não é lucro líquido: registre todos os custos, incluindo reposição de produtos recebidos como presente, para uma análise sustentável.</div>`}
function settings(){return `<section class="panel"><h2>Backup dos seus registros</h2><p>Exporte seus dados para um arquivo JSON e guarde uma cópia em local seguro. Você pode importar esse arquivo depois.</p><div class="actions" style="margin-top:20px"><button class="btn" data-action="export">Baixar backup (.json)</button><label class="btn secondary" style="cursor:pointer">Importar backup <input id="importFile" type="file" accept=".json,application/json" style="display:none"></label></div></section><section class="panel"><h2>Segurança e limitações da V1</h2><p>Esta versão armazena dados somente neste navegador, neste dispositivo. Limpar os dados do navegador ou usar navegação privada pode apagar os registros. Não existe login, banco de dados online ou sincronização entre dispositivos. Não use dados pessoais reais de clientes até implementarmos autenticação, proteção e backup adequados.</p></section><section class="panel"><h2>Reiniciar protótipo</h2><p>Apaga todos os registros deste navegador. Exporte um backup antes, se necessário.</p><div style="margin-top:16px"><button class="btn danger" data-action="reset">Apagar todos os dados</button></div></section>`}
document.addEventListener('click',e=>{const navbtn=e.target.closest('[data-page]');if(navbtn){setPage(navbtn.dataset.page);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action,ref=btn.dataset.id;if(a==='export'){const blob=new Blob([JSON.stringify({app:'godoy-manager',version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='godoy-manager-backup-'+new Date().toISOString().slice(0,10)+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),500);return}if(a==='reset'){if(confirm('Apagar TODOS os dados locais? Essa ação não pode ser desfeita.')){db=fresh();save();render()}return}if(a==='viewInspection'){const i=db.inspections.find(x=>x.id===ref);if(i)alert(`GODOY AUTO CARE — FICHA\nCliente: ${customerName(i.customerId)}\nData: ${dateBR(i.date)}\nSujeira: ${i.dirt}\nInício: ${i.start||'—'} | Fim: ${i.end||'—'}\nV-Floc: ${i.shampoo||'—'} mL\n\n${steps.map((s,n)=>`${i.steps.includes(n)?'✓':'○'} ${s}`).join('\n')}\n\nObservações: ${i.notes||'Nenhuma'}`);return}if(a==='complete'||a==='cancel'){const ap=db.appointments.find(x=>x.id===ref);if(ap&&confirm(a==='complete'?'Marcar atendimento como concluído?':'Cancelar agendamento?')){ap.status=a==='complete'?'Concluído':'Cancelado';save();render()}return}const map={removeCustomer:['customers','cliente'],removeAppointment:['appointments','agendamento'],removeInspection:['inspections','ficha'],removeExpense:['expenses','despesa']};if(map[a]){const [k,label]=map[a];if(k==='customers'&&(db.appointments.some(x=>x.customerId===ref)||db.inspections.some(x=>x.customerId===ref))){alert('Este cliente tem atendimentos ou fichas vinculados. Exclua os registros vinculados primeiro.');return}if(confirm(`Excluir ${label}?`)){db[k]=db[k].filter(x=>x.id!==ref);save();render()}}});
document.addEventListener('submit',e=>{const f=e.target;if(!['customerForm','appointmentForm','inspectionForm','expenseForm'].includes(f.id))return;e.preventDefault();if(!f.reportValidity())return;switch(f.id){case'customerForm':db.customers.push({id:id(),name:val(f,'name'),phone:val(f,'phone'),vehicle:val(f,'vehicle'),plate:val(f,'plate')});break;case'appointmentForm':db.appointments.push({id:id(),customerId:val(f,'customerId'),service:val(f,'service'),date:val(f,'date'),time:val(f,'time'),price:Number(val(f,'price')),notes:val(f,'notes'),status:'Agendado'});break;case'inspectionForm':db.inspections.push({id:id(),customerId:val(f,'customerId'),date:val(f,'date'),dirt:val(f,'dirt'),shampoo:val(f,'shampoo'),start:val(f,'start'),end:val(f,'end'),notes:val(f,'notes'),steps:steps.map((_,i)=>i).filter(i=>f.elements['step'+i].checked)});break;case'expenseForm':db.expenses.push({id:id(),description:val(f,'description'),amount:Number(val(f,'amount')),date:val(f,'date'),category:val(f,'category')});break}save();render()});document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;const file=e.target.files?.[0];if(!file)return;try{if(file.size>2e6)throw Error('Arquivo muito grande.');const obj=JSON.parse(await file.text());if(obj.app!=='godoy-manager'||!obj.data||!['customers','appointments','inspections','expenses'].every(k=>Array.isArray(obj.data[k])))throw Error('Formato de backup inválido.');if(confirm('Substituir todos os registros atuais pelos dados do backup?')){db=obj.data;save();render();alert('Backup importado.')}}catch(err){alert('Falha ao importar: '+err.message)}});render();
</script></body></html>
